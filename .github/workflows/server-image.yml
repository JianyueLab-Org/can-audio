# 服务端镜像：mumble-server + Ice 认证器，推到 GHCR，服务器上 docker compose pull 就能升级。
#
# 和「打包与发布」那个工作流互不相干：那个出的是四个 Windows 客户端的 zip，
# 只在 windows runner 上打；这个出的是一个 linux/amd64 的镜像。改客户端不会
# 触发这里，改 server/ 或 Dockerfile 才会。
#
# **构建完必须真的把容器跑起来看一眼。** 这个镜像的失败模式全都是"构建成功、
# 运行时才发现"：漏了 serverconf.py 是 import 报错、start.sh 不可执行是
# exec 失败、ini 或 slice 路径探错了是 Ice 连不上——而它们在 docker build
# 的输出里一律是绿色的。冒烟那一步等的是容器自己的 HEALTHCHECK 变 healthy，
# 再确认日志里出现了认证器注册成功的那两行。
#
# 只出 linux/amd64。arm64 得靠 QEMU 跑 apt 和 slice2py，慢十几分钟，而这套东西
# 是部署在 x86 服务器上的。真要 arm 就给 platforms 加一项。
#
# 通播机队（server/ATIS/）的依赖不在这个镜像里，它不在 CMD 里而且 numpy +
# ffmpeg 会让镜像大一大圈。要跑它用 docker-compose.yml 里的 atis profile，
# 那边是本地 --build-arg WITH_ATIS=1 构建的。

name: 服务端镜像

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/**'
      - '.github/workflows/server-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/**'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

# 默认只读。写 GHCR 的权限只给最后的 publish job，而且它不在 PR 上跑。
# test / image 两个 job 执行的都是 PR 里的代码（单元测试、Dockerfile 的
# RUN、冒烟容器），同仓库的 PR 能从这两个 job 里读到 GITHUB_TOKEN——如果
# 这里写 packages: write，等于让任何能开 PR 的人往 latest 推镜像。
permissions:
  contents: read

# 同一个分支上后一次推送把前一次顶掉：镜像只有最新那个有意义
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # 冒烟用的本地标签，只在 runner 的 daemon 里存在，不推
  CI_TAG: can-server:ci
  PYTHONUTF8: '1'        # runner 上跑的是中文 print，见 release.yml 里的说明

jobs:
  test:
    # 镜像里带的就是这些代码，装进去之前先跑一遍。和 release.yml 的 windows
    # 测试重复，但那个只在改客户端时才有意义地跑，而且发布路径太长。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 别把 token 留在 .git/config 里给 PR 代码读
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 ATIS 测试要的东西
        # server/ 的测试把 Ice / MumbleServer / requests 都换成了替身，什么都
        # 不用装；server/ATIS 的不行——它导入真的 pymumble，而 pymumble 在
        # import 阶段就用 ctypes 加载原生 opus，没有 libopus0 整个模块收集失败。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0
          python -m pip install --upgrade pip
          pip install pymumble numpy

      - name: 单元测试
        run: |
          set -euo pipefail
          failed=()
          for d in server server/ATIS; do
            echo "::group::$d"
            (cd "$d" && python -m unittest discover -p "test_*.py") || failed+=("$d")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "这些目录的测试没过: ${failed[*]}" >&2
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: 镜像名转小写
        # 镜像引用只收小写，而 github.repository 是 JianyueLab-Org/…，直接用
        # 会在 docker 那里报 "repository name must be lowercase"
        run: |
          echo "IMAGE=$(echo "ghcr.io/${{ github.repository }}-server" \
                        | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - id: meta
        # 只是算标签和 OCI label，不需要任何权限。在这里算是为了让 label 在
        # 构建时就打进镜像——publish 推的是这一份，不会再 build。
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest 只跟 main；每次构建都另有一个按 commit 定位的标签，
          # 部署出问题时能精确回滚到上一个 sha
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: 构建（先装进本地 daemon，冒烟过了再推）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.CI_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ice 现场（冒烟挂了就看这一段）
        # 冒烟失败时最想知道的三件事，而容器一退就问不到了（start.sh 等不到
        # Ice 会整个退出），所以在冒烟之前单独跑几个一次性容器取出来。
        #
        # 排过一次的经历：Murmur 起来了、64738 在听、日志里关于 Ice 一个字都
        # 没有、6502 从没开过。三件事各自排除一种可能——没链接 Ice 库（那是
        # 包的问题）、ini 里没有 ice=（那是构建的问题）、ice= 落在某个
        # [section] 底下（那是 QSettings 分节，Murmur 读不到且不报错）。
        run: |
          echo "::group::mumble-server 链接了哪些 Ice 库"
          docker run --rm --entrypoint sh ${{ env.CI_TAG }} -c \
            'ldd /usr/bin/mumble-server | grep -i ice || echo "(一个 Ice 库都没链接——这个包没编 Ice)"'
          echo "::endgroup::"

          echo "::group::ini 里的节，以及 Ice 相关的行"
          docker run --rm --entrypoint sh ${{ env.CI_TAG }} -c \
            '. /etc/can/paths.env; echo "ini=$MUMBLE_INI"; grep -nE "^\[|^#?ice" "$MUMBLE_INI" || echo "(一行都没有)"'
          echo "::endgroup::"

      - name: 冒烟：容器真的能起来并且认证器注册上了
        run: |
          set -euo pipefail
          # 一次性的随机口令。这里不写任何字面量密码——写进工作流的口令会跟着
          # 仓库到处走，和写进 Dockerfile 是一回事（见 test_serverconf.py）。
          docker run -d --name smoke \
            -e MUMBLE_SUPERUSER_PASSWORD="$(openssl rand -hex 12)" \
            ${{ env.CI_TAG }}

          echo "::group::等 HEALTHCHECK"
          status=starting
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo gone)"
            echo "健康状态: $status"
            case "$status" in healthy|unhealthy|gone) break ;; esac
            sleep 2
          done
          echo "::endgroup::"

          echo "::group::容器日志"
          docker logs smoke 2>&1 || true
          echo "::endgroup::"

          if [ "$status" != healthy ]; then
            echo "容器没变成 healthy（$status）" >&2
            exit 1
          fi

          # healthy 只说明 64738 在听、login.py 这个进程还在。真正要确认的是
          # 认证器和回调都注册上了——这两个缺任何一个，服务器看着正常但要么
          # 所有人登录被拒，要么重复登录踢不掉旧连接。
          logs="$(docker logs smoke 2>&1)"
          for marker in "认证器已设置" "服务器回调已注册"; do
            if ! grep -qF "$marker" <<<"$logs"; then
              echo "日志里没有「$marker」，认证器没注册成功" >&2
              exit 1
            fi
          done
          echo "冒烟通过"

      - name: 收摊
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

      - name: 把冒烟过的这份镜像交给 publish
        # 推的必须是刚才真跑起来过的那一份，而不是重新 build 的——缓存只要
        # 有一层没命中（apt 源更新了、缓存被清了），重建出来的就是一个没冒烟
        # 过的镜像。只在会发布的时候存，PR 上不浪费这几百 MB。
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save ${{ env.CI_TAG }} | gzip -1 > server-image.tar.gz

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server-image.tar.gz
          retention-days: 1
          compression-level: 0     # 已经 gzip 过了

  publish:
    # 只有这个 job 能写 GHCR。PR 上不跑，别的分支（包括手动触发时选了别的
    # 分支）也不跑——不然任何能推分支的人都能发一个 sha- 标签出去。
    # 它不 checkout、不 build，只加载 image job 冒烟过的那一份镜像，
    # 打上标签推上去：这个 job 里不执行仓库里的任何代码。
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 GHCR 要写权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-image

      - name: 加载镜像
        run: gunzip -c server-image.tar.gz | docker load

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推镜像
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -euo pipefail
          [ -n "$TAGS" ] || { echo "image job 没给出任何标签" >&2; exit 1; }
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CI_TAG" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: 说一下推了什么
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          {
            echo "### 服务端镜像"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "服务器上升级：\`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
