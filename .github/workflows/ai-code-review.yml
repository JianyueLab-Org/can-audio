name: AI Code Review

# Reviews each PR's diff via JianyueLab-Org's reusable AI-review workflow and
# posts/updates a single PR comment. Runs on open + every new push to the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# The reusable workflow posts a comment, so the caller must grant write here.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: JianyueLab-Org/actions/.github/workflows/ai-code-review.yml@main
    # Same org as the reusable workflow: AI_API_KEY and AI_BASE_URL are inherited.
    secrets: inherit
